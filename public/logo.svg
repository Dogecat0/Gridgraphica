<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Paper Base Stamp Background (Warmer Cream) -->
  <rect x="8" y="8" width="104" height="104" rx="22" fill="#f4f3e6"/>
  
  <!-- Outer Ring Detail (Archivist feel) -->
  <rect x="18" y="18" width="84" height="84" rx="14" fill="none" stroke="#b08d57" stroke-width="2" stroke-dasharray="4 4" />

  <!-- The Server Rack (Data Center Iconography) -->
  <!-- Top Blade -->
  <circle cx="78" cy="39" r="6" fill="#a33333" />
  <line x1="36" y1="39" x2="60" y2="39" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" />

  <!-- Middle Blade -->
  <circle cx="78" cy="60" r="6" fill="#1a1a1a" />
  <line x1="36" y1="60" x2="60" y2="60" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" />

  <!-- Bottom Blade -->
  <circle cx="78" cy="81" r="6" fill="#1a1a1a" />
  <line x1="36" y1="81" x2="60" y2="81" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" />
</svg>
